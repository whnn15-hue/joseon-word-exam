<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사회 1단원 연습하기</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/unit1/style.css">
</head>
<body>
<header><h1>사회 1단원 연습하기</h1><p>유적과 유물로 살펴본 옛사람들의 생활 | 빈칸을 채우고 문단마다 확인을 눌러요</p></header>
<div class="sticky" id="stick" hidden><span>맞힌 빈칸</span><b id="cnt"></b></div>
<main>
<section class="card" id="top">
<h2>어느 부분을 연습할까요?</h2>
<div class="chips" id="parts"></div>
<p class="msg" id="msg" style="color:var(--soft)">연습지를 불러오고 있어요...</p>
<div class="rules"><p>문단마다 기회는 두 번이에요. 두 번 다 틀리면 정답을 보여 줘요.</p><p>막히면 초성 힌트를 눌러 보세요. 띄어쓰기는 틀려도 괜찮아요.</p></div>
</section>
<div id="paper"></div>
<section class="card" id="foot" hidden><div class="row" style="margin-top:0"><button class="btn ghost" id="resetBtn">이 부분 처음부터 다시 풀기</button></div></section>
</main>

<script src="/unit1/paper.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho = s => [...s].map(c => { const k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c; }).join('');
const norm = s => String(s || '').replace(/[\s「」『』“”"'.,()\[\]·!?~\-]/g, '').toLowerCase();
let D = null, A = null, G = [], cur = 0, ok = new Set(), okv = {}, rev = {}, tries = {};

Promise.all([fetch('/api/unit1/exam', { cache: 'no-store' }).then(r => r.json()), fetch('/api/unit1/practice', { cache: 'no-store' }).then(r => r.json())])
  .then(([d, p]) => {
    if (!p.ok) { $('msg').textContent = p.msg; return; }
    D = d; A = p.answers; G = p.groups;
    $('msg').textContent = ''; $('stick').hidden = false; $('foot').hidden = false;
    $('parts').innerHTML = D.parts.map((t, i) => '<button class="chip" data-p="' + i + '" aria-pressed="' + (i === 0) + '">' + Paper.esc(t.replace(/\s*\(.*\)$/, '')) + '</button>').join('') +
      '<button class="chip" data-p="all" aria-pressed="false">전체</button>';
    show(0);
  }).catch(() => { $('msg').textContent = '연습지를 불러오지 못했어요. 새로고침해 보세요.'; });

const groupOf = n => G.find(g => g.includes(n));
const extra = (it, k) => '<div class="row" style="margin-top:8px"><button class="btn hint small" data-hint="' + k + '">초성 힌트</button><button class="btn small" data-check="' + k + '">확인</button></div><div class="itemfb" id="fb' + k + '"></div>';

function show(p) {
  cur = p;
  const parts = p === 'all' ? D.parts.map((_, i) => i) : [p];
  $('paper').innerHTML = Paper.render(D, parts, extra);
  for (const c of $('parts').children) c.setAttribute('aria-pressed', String(c.dataset.p) === String(p));
  ok.forEach(n => { const x = $('b' + n); if (x) { x.value = okv[n] || A[n - 1].split('|')[0]; x.readOnly = true; $('bl' + n).classList.add('ok'); } });
  Object.keys(rev).forEach(n => { const x = $('b' + n); if (x) { x.value = rev[n]; x.readOnly = true; $('bl' + n).classList.add('rev'); } });
  count();
}
function count() { $('cnt').textContent = ok.size + ' / ' + A.length; }

$('parts').onclick = e => { const b = e.target.closest('.chip'); if (b) show(b.dataset.p === 'all' ? 'all' : +b.dataset.p); };

$('paper').addEventListener('click', e => {
  const h = e.target.closest('[data-hint]'), c = e.target.closest('[data-check]');
  if (h) {
    Paper.blanksOf(D.items[+h.dataset.hint].t).forEach(n => {
      if (ok.has(n)) return;
      const g = groupOf(n);
      $('b' + n).placeholder = g ? A[n - 1].split('|').map(cho).join(', ') + ' 중' : cho(A[n - 1].split('|')[0]);
    });
  }
  if (c) check(+c.dataset.check);
});
$('paper').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input')) return;
  e.preventDefault();
  const item = e.target.closest('.item'), all = [...item.querySelectorAll('input:not([readonly])')], i = all.indexOf(e.target);
  if (all[i + 1]) all[i + 1].focus(); else check(+item.id.slice(2));
});

function check(k) {
  const ns = Paper.blanksOf(D.items[k].t);
  if (ns.every(n => ok.has(n) || rev[n])) return;
  if (ns.some(n => !ok.has(n) && !$('b' + n).value.trim())) { const fb = $('fb' + k); fb.className = 'itemfb no'; fb.textContent = '빈칸을 모두 채우고 확인을 눌러요.'; return; }
  tries[k] = (tries[k] || 0) + 1;
  const used = new Set(ns.filter(n => ok.has(n) && groupOf(n)).map(n => norm(okv[n])));
  ns.forEach(n => {
    if (ok.has(n)) return;
    const x = $('b' + n), v = norm(x.value), alts = A[n - 1].split('|').map(norm);
    const g = groupOf(n);
    let right = alts.includes(v);
    if (g) {
      right = right && !used.has(v);
      if (right) used.add(v);
    }
    $('bl' + n).classList.remove('no');
    if (right) { ok.add(n); okv[n] = x.value; x.readOnly = true; $('bl' + n).classList.add('ok'); }
    else $('bl' + n).classList.add('no');
  });
  const left = ns.filter(n => !ok.has(n)), fb = $('fb' + k);
  if (!left.length) { fb.className = 'itemfb ok'; fb.textContent = tries[k] === 1 ? '모두 맞았어요!' : '두 번째에 모두 맞혔어요!'; }
  else if (tries[k] < 2) { fb.className = 'itemfb no'; fb.textContent = '빨간 빈칸을 다시 생각해 볼까요? 기회가 한 번 더 있어요.'; $('b' + left[0]).select(); }
  else {
    const usedNames = new Set(ns.filter(n => ok.has(n)).map(n => norm(okv[n])));
    const lines = [];
    left.forEach(n => {
      const g = groupOf(n), x = $('b' + n);
      let ans = A[n - 1].split('|')[0];
      if (g) { ans = A[n - 1].split('|').find(a => !usedNames.has(norm(a))) || ans; usedNames.add(norm(ans)); }
      lines.push('<p><b>' + n + '번</b> 정답은 <b>' + Paper.esc(ans) + '</b> (내가 쓴 답: ' + Paper.esc(x.value.trim()) + ')</p>');
      rev[n] = ans; x.value = ans; x.readOnly = true;
      $('bl' + n).classList.remove('no'); $('bl' + n).classList.add('rev');
    });
    fb.className = 'itemfb no';
    fb.innerHTML = lines.join('') + '<p>정답을 기억하고 다음 문단으로 가요.</p>';
  }
  count();
}

$('resetBtn').onclick = () => {
  const parts = cur === 'all' ? D.parts.map((_, i) => i) : [cur];
  D.items.forEach((it, k) => { if (parts.includes(it.p)) { delete tries[k]; Paper.blanksOf(it.t).forEach(n => { ok.delete(n); delete okv[n]; delete rev[n]; }); } });
  show(cur); window.scrollTo(0, 0);
};
}
</script>
</body>
</html>
